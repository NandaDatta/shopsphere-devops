services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopsphere-jenkins

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "1003"

volumes:
  jenkins_home:
